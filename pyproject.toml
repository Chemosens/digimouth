[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digimouth"
version = "2.0.0"
description = "Simulation and parameter fitting of dynamic (ODE) models of aroma release in the mouth"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    {name = "Caroline Peltier", email = "caroline.peltier@inrae.fr"}
]
keywords = ["ODE", "simulation", "parameter-fitting", "aroma-release", "in-vivo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "pandas>=1.3",
    "sympy>=1.9",
    "matplotlib>=3.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["digimouth*"]

[tool.pytest.ini_options]
testpaths = ["digimouth/tests"]
markers = ["unit: unit tests of the numerical engine, models and fitting"]
